[project]
name = "flyrank-background-jobs"
version = "0.1.0"
description = "FastAPI and SQLite background-job assignment with a separate worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]

[tool.setuptools]
package-dir = {"" = "artifacts/flyrank-background-jobs"}

[tool.setuptools.packages.find]
where = ["artifacts/flyrank-background-jobs"]
include = ["backend*"]
